version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        # Amplify exposes console environment variables to the build container,
        # but not reliably to the SSR runtime that executes route handlers.
        # Writing them here puts them where Next.js loads them at server start.
        # `|| true` so the build still succeeds when the variable is unset.
        # This corridor's VDOT datasets are keyless, so there is no
        # agency key to forward. RESEND_API_KEY is forwarded the way
        # the master forwards its keys. Set it at BOTH app level and
        # branch level in the console; app level alone did not reach
        # the runtime on a sister site (Wasatch lesson, Nov 4, 2026).
        - env | grep -e RESEND_API_KEY >> .env.production || true
        - env | grep -e STORM_ALERTS_SEGMENT_ID >> .env.production || true
        - env | grep -e NEXT_PUBLIC_GA_ID >> .env.production || true
        # AdSense (Nov 15, 2026): forwards NEXT_PUBLIC_ADSENSE_ID and the
        # NEXT_PUBLIC_ADSENSE_SLOT_* unit IDs the same way, so the build
        # inlines them for the gated loader and slots (app/layout.js,
        # components/AdSlot.js). Unset until activation; build is
        # unchanged while they are absent.
        - env | grep -e NEXT_PUBLIC_ADSENSE >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
